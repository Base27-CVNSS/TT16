name: Build clean TT16 templates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "tools/build_clean_templates.py"
      - "tools/verify_templates.py"
      - ".github/workflows/build-clean-templates.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GIS dependencies
        run: python -m pip install --upgrade pip geopandas pyogrio pandas
      - name: Build 35 normalized clean FileGDB ZIPs
        run: python tools/build_clean_templates.py --out templates/generated --jobs 4
      - name: Strict deep QA — must be 35/35 PASS
        run: python tools/verify_templates.py templates/generated --deep --expect 35
      - name: Commit generated templates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: regenerate 35 normalized TT16 templates [skip ci]"
          git push
